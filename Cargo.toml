[package]
name = "jj-commit"
version = "0.44.0"
edition = "2024"
description = "Simplify the jj commit experience"
repository = "https://github.com/Odonno/jj-commit"
readme = "README.md"
license-file = "LICENSE"
keywords = ["cli", "jujutsu"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
color-eyre = "=0.6.5"
dunce = "=1.0.5"
inquire = "=0.9.4"
futures = "=0.3.32"
jj-lib = "=0.45.1"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "=2.2.2"
gix-hash = "=0.26.2"
tempfile = "=3.27.0"

[[bin]]
name = "jjc"
path = "src/main.rs"
